  - id: "03"
    slug: "geometria-trigonometria-y-geometria-analitica"
    title: "Geometría, trigonometría y geometría analítica"
    level: "basico-intermedio"
    engine: "part03"
    summary: "Del espacio a las coordenadas: distancia, ángulo, trigonometría, transformaciones lineales en el plano, coordenadas polares y proyección."
    applications: "gráficos por computador, robótica, visión artificial, GIS y videojuegos"
    ai_link: "Las transformaciones geométricas son el caso visual de las transformaciones lineales que una red aplica a sus activaciones; la similitud coseno es trigonometría en alta dimensión."
    key_ideas:
      - "El radián no es una unidad decorativa: es la que hace que d(sin x)/dx = cos x."
      - "Toda rotación 2D es una matriz ortogonal de determinante 1."
      - "El producto punto mide alineación; la norma mide magnitud."
      - "Componer transformaciones es multiplicar matrices, y el orden importa."
      - "Las coordenadas homogéneas convierten la traslación en multiplicación."
    pitfalls:
      - "Mezclar grados y radianes en la misma expresión."
      - "Aplicar rotación y traslación en el orden equivocado."
      - "Olvidar normalizar antes de comparar direcciones."
    stack:
      - "math"
      - "numpy (opcional)"
    references:
