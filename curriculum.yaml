  - id: "01"
    slug: "aritmetica-computacional-y-representacion-numerica"
    title: "Aritmética computacional y representación numérica"
    level: "basico-computacional"
    engine: "part01"
    summary: "Qué es realmente un número dentro de una máquina: bits, complemento a dos, IEEE 754, error, condicionamiento y estabilidad."
    applications: "motores numéricos, finanzas, simulación científica y depuración de resultados irreproducibles"
    ai_link: "float32, bfloat16 y la cuantización a int8 son decisiones de representación. Los NaN en un entrenamiento casi siempre nacen aquí, no en la arquitectura."
    key_ideas:
      - "Un float es un racional binario de precisión finita, no un número real."
      - "El error relativo, no el absoluto, es la magnitud que se propaga."
      - "Condicionamiento es del problema; estabilidad es del algoritmo."
      - "La cancelación catastrófica destruye dígitos significativos sin lanzar excepciones."
      - "Reproducibilidad numérica exige fijar orden de operaciones, no solo semillas."
    pitfalls:
      - "Comparar floats con `==` en lugar de una tolerancia razonada."
      - "Suponer que la suma de floats es asociativa."
      - "Usar float para dinero en vez de Decimal o enteros de centavos."
    stack:
      - "struct"
      - "decimal"
      - "fractions"
      - "sys.float_info"
    references:
      - "Goldberg, D. *What Every Computer Scientist Should Know About Floating-Point Arithmetic*. ACM Computing Surveys, 1991."
      - "Higham, N. J. *Accuracy and Stability of Numerical Algorithms*. 2ª ed., SIAM, 2002."
      - "IEEE 754-2019 Standard for Floating-Point Arithmetic."
