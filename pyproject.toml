[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-mathematics-program"
version = "0.2.0"
description = "Programa educativo de matemática computacional en español: de cero absoluto a la matemática de la IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vladimir Acuña" }]
keywords = [
  "mathematics",
  "computational-mathematics",
  "education",
  "linear-algebra",
  "calculus",
  "probability",
  "statistics",
  "numerical-methods",
  "optimization",
  "machine-learning",
  "deep-learning",
  "spanish",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["PyYAML>=6,<7"]

[project.urls]
Homepage = "https://vladimiracunadev-create.github.io/computational-mathematics-program/"
Repository = "https://github.com/vladimiracunadev-create/computational-mathematics-program"
Changelog = "https://github.com/vladimiracunadev-create/computational-mathematics-program/blob/main/CHANGELOG.md"
Issues = "https://github.com/vladimiracunadev-create/computational-mathematics-program/issues"

[project.optional-dependencies]
# Contraste profesional para los notebooks. Los laboratorios NO los necesitan.
scientific = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12", "matplotlib>=3.8", "pandas>=2.1"]
ai = ["scikit-learn>=1.4", "torch>=2.2"]
research = ["jax>=0.4", "cvxpy>=1.4", "pymc>=5.10", "networkx>=3.2"]
notebooks = ["jupyterlab>=4.1", "nbformat>=5.10"]
manual = ["xhtml2pdf>=0.2,<1"]
dev = ["ruff>=0.4"]

[project.scripts]
compmath = "computational_math.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["classes", "site"]

[tool.ruff.lint]
# B905/UP no se activan: exigirían reescribir cientos de `zip` didácticos
# sin ganancia pedagógica. E501 se delega a la longitud de línea de arriba.
select = ["E", "F", "W", "I", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/computational_math/__init__.py" = ["E402"]
