name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar el paquete y pip-audit
        run: |
          python -m pip install -e .
          python -m pip install pip-audit
      - name: pip-audit sobre el entorno instalado
        run: pip-audit

  sast:
    name: Análisis estático (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar bandit
        run: python -m pip install bandit
      # B311 (random no criptográfico) es esperado y está declarado en SECURITY.md:
      # las demostraciones generan datos didácticos con semilla fija.
      - name: bandit sobre el código propio
        run: bandit -q -r src scripts --severity-level medium

  workflows:
    name: Auditoría de workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar zizmor
        run: python -m pip install zizmor
      - name: Analizar .github/workflows
        run: zizmor --min-severity medium .github/workflows

  supply-chain:
    name: Cadena de suministro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Todas las acciones deben estar fijadas por SHA
        run: |
          # Anclado a inicio de línea: sin el ancla, el patrón se encuentra a sí mismo
          # dentro de este mismo bloque `run` y el paso falla siempre.
          usos=$(grep -rhE "^[[:space:]]*(- )?uses:" .github/workflows || true)
          sin_pin=$(echo "$usos" | grep -vE "@[0-9a-f]{40}([[:space:]]|$)" | grep -v "^$" || true)
          if [ -n "$sin_pin" ]; then
            echo "Acciones sin fijar por SHA de 40 caracteres:"
            echo "$sin_pin"
            exit 1
          fi
          echo "Todas las acciones están fijadas por SHA."
      - name: El repositorio no contiene binarios ni archivos comprimidos
        run: |
          hallazgos=$(git ls-files | grep -iE "\.(exe|dll|so|dylib|zip|tar|gz|whl|jar|bin)$" || true)
          if [ -n "$hallazgos" ]; then
            echo "Archivos binarios versionados:"
            echo "$hallazgos"
            exit 1
          fi
          echo "Sin binarios versionados."

  summary:
    name: Puerta de seguridad
    if: always()
    needs: [dependencies, sast, workflows, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que todos los análisis estén en verde
        run: |
          test "${{ needs.dependencies.result }}" = "success"
          test "${{ needs.sast.result }}" = "success"
          test "${{ needs.workflows.result }}" = "success"
          test "${{ needs.supply-chain.result }}" = "success"
